<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | The Smart Choice Meal Blueprint</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="custom.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--forest) 0%, #1a3a1a 60%, #2d4a1a 100%);
    display: flex;
    align-items: center;
    padding: 2rem 0;
  }
  .auth-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 2.5rem;
    max-width: 440px;
    width: 100%;
    margin: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" style="text-decoration:none;">
          <i class="fa-solid fa-seedling fa-2x" style="color:var(--forest);"></i>
          <div style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--forest);margin-top:.25rem;">Smart Choice Meal Blueprint</div>
        </a>
      </div>
      <h2 style="font-size:1.7rem;text-align:center;margin-bottom:1.75rem;">Welcome Back</h2>
      <form class="form-scmb">
        <div class="mb-3">
          <label>Email Address</label>
          <input class="form-control" type="email" placeholder="you@email.com">
        </div>
        <div class="mb-4">
          <label>Password</label>
          <input class="form-control" type="password" placeholder="••••••••">
        </div>
        <button type="button" class="btn-primary-cta d-block w-100 text-center" onclick="alert('Demo mode — login not enabled yet!')">Sign In</button>
      </form>
      <p class="text-center mt-4" style="font-size:.9rem;color:var(--muted);">Don't have an account? <a href="signup.html" style="color:var(--forest);font-weight:600;">Start your free trial</a></p>
      <p class="text-center" style="font-size:.82rem;color:var(--muted);"><a href="index.html" style="color:var(--muted);">← Back to Home</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
