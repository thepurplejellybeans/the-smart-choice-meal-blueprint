<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Free Trial | The Smart Choice Meal Blueprint</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="custom.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--forest) 0%, #1a3a1a 60%, #2d4a1a 100%);
    display: flex;
    align-items: center;
    padding: 2rem 0;
  }
  .auth-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 2.5rem;
    max-width: 500px;
    width: 100%;
    margin: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .plan-pick {
    border: 2px solid var(--tan-lt);
    border-radius: 10px;
    padding: 1rem;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .plan-pick:hover, .plan-pick.selected {
    border-color: var(--forest);
    background: var(--cream);
  }
  .plan-pick input { display: none; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" style="text-decoration:none;">
          <i class="fa-solid fa-seedling fa-2x" style="color:var(--forest);"></i>
          <div style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:600;color:var(--forest);margin-top:.25rem;">Smart Choice Meal Blueprint</div>
        </a>
      </div>
      <h2 style="font-size:1.7rem;text-align:center;margin-bottom:.5rem;">Start Your Free Trial</h2>
      <p class="text-center text-muted mb-4" style="font-size:.9rem;">3 days free · No credit card needed · Cancel anytime</p>

      <!-- PLAN PICKER -->
      <p style="font-weight:600;font-size:.88rem;text-transform:uppercase;letter-spacing:.06em;color:var(--forest);margin-bottom:.75rem;">Choose your plan:</p>
      <div class="row g-2 mb-4">
        <div class="col-4">
          <label class="plan-pick d-block text-center" onclick="this.classList.toggle('selected')">
            <input type="radio" name="plan" value="starter">
            <div style="font-weight:700;color:var(--forest);">Starter</div>
            <div style="font-size:.78rem;color:var(--muted);">$19/mo</div>
          </label>
        </div>
        <div class="col-4">
          <label class="plan-pick selected d-block text-center" onclick="document.querySelectorAll('.plan-pick').forEach(p=>p.classList.remove('selected'));this.classList.add('selected')">
            <input type="radio" name="plan" value="pro" checked>
            <div style="font-weight:700;color:var(--forest);">Pro</div>
            <div style="font-size:.78rem;color:var(--muted);">$39/mo</div>
            <span style="font-size:.68rem;background:var(--accent);color:#fff;border-radius:10px;padding:.1rem .5rem;">Popular</span>
          </label>
        </div>
        <div class="col-4">
          <label class="plan-pick d-block text-center" onclick="document.querySelectorAll('.plan-pick').forEach(p=>p.classList.remove('selected'));this.classList.add('selected')">
            <input type="radio" name="plan" value="premium">
            <div style="font-weight:700;color:var(--forest);">Premium</div>
            <div style="font-size:.78rem;color:var(--muted);">$79/mo</div>
          </label>
        </div>
      </div>

      <form class="form-scmb">
        <div class="row g-3">
          <div class="col-6">
            <label>First Name</label>
            <input class="form-control" placeholder="Jane">
          </div>
          <div class="col-6">
            <label>Last Name</label>
            <input class="form-control" placeholder="Smith">
          </div>
          <div class="col-12">
            <label>Email Address</label>
            <input class="form-control" type="email" placeholder="jane@email.com">
          </div>
          <div class="col-12">
            <label>Password</label>
            <input class="form-control" type="password" placeholder="Create a password">
          </div>
          <div class="col-12">
            <button type="button" class="btn-primary-cta d-block w-100 text-center" onclick="alert('Demo mode — signup not enabled yet. Thank you for your interest!')">
              <i class="fa-solid fa-gift me-2"></i>Start Free Trial
            </button>
          </div>
        </div>
      </form>
      <p class="text-center mt-3" style="font-size:.82rem;color:var(--muted);">Already a member? <a href="login.html" style="color:var(--forest);font-weight:600;">Sign in</a></p>
      <p class="text-center" style="font-size:.78rem;color:var(--muted);">By signing up you agree to our Terms of Service. Your trial begins immediately with no charge.</p>
      <p class="text-center" style="font-size:.78rem;"><a href="index.html" style="color:var(--muted);">← Back to Home</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
